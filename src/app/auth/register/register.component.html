<section class="p-16">
    <div class="flex justify-center items-center">
        <form class="p-4 shadow-sm grid grid-rows-[1fr_3fr_1fr] border-2 border-stone-300 rounded gap-2">
            <div class="p-4">
                <span class="text-[#748CAB] font-light">Sign-up</span>
                <h2 class="lg:text-3xl md:text-2xl text-xl font-medium">New User?</h2>
            </div>
            <div class="grid place-items-center grid-rows-3 grid-cols-2 place-self-center min-w-[500px] max-w-[700px] [&>div]:p-2 [&>div]:mb-2 [&>div]:grid [&>div]:w-full">
                <div>
                    <label for="surname">Surname</label>
                    <input id="surname" class="p-2 outline-none border-2 border-[#0D1321] bg-gray-50 focus:bg-white rounded" type="text" placeholder="surname">
                </div>
                <div>
                    <label for="name">Name</label>
                    <input id="name" class="p-2 outline-none border-2 border-[#0D1321] bg-gray-50 focus:bg-white rounded" type="text" placeholder="name">
                </div>
                <div class="col-span-2">
                    <label for="email">Email</label>
                    <input id="email" class="p-2 outline-none border-2 border-[#0D1321] bg-gray-50 focus:bg-white rounded" type="text" placeholder="email">
                </div>
                <div>
                    <label for="password">Password</label>
                    <input id="password" class="p-2 outline-none border-2 border-[#0D1321] bg-gray-50 focus:bg-white rounded" type="text" placeholder="password">
                </div>
                <div>
                    <label for="confirm_password">Confirm Password</label>
                    <input id="confirm_password" class="p-2 outline-none border-2 border-[#0D1321] bg-gray-50 focus:bg-white rounded" type="text" placeholder="confirm">
                </div>
            </div>
            <div class="p-2">
                <div class="mb-2 text-md">
                    <h2>Already a user? <a [routerLink]="'/auth/login'" class="hover:underline text-[#748CAB]">sign in</a></h2>
                </div>
                <button class="py-2 px-6 w-full rounded bg-[#5F8FB9FF] hover:bg-[#779EC0FF] text-white font-medium cursor-pointer" type="submit">
                    Sign up
                </button>
            </div>
        </form>
    </div>
</section>
