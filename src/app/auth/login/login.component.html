<section class="p-16">
    <div class="flex justify-center items-center">
        <form class="p-4 shadow-sm grid grid-rows-[1fr_2fr_1fr] border-2 border-stone-300 rounded gap-2">
            <div class="p-4">
                <span class="text-[#748CAB] font-light">Sign-in</span>
                <h2 class="lg:text-3xl md:text-2xl text-xl font-medium">Welcome back!</h2>
            </div>
            <div class="grid place-items-center grid-rows-[1fr_1fr] place-self-center min-w-[300px] max-w-[400px]">
                <div class="p-2 mb-2 grid w-full">
                    <label for="email">Email</label>
                    <input id="email" class="p-2 outline-none border-2 border-[#0D1321] bg-gray-50 focus:bg-white rounded" type="text" placeholder="email">
                </div>
                <div class="p-2 mb-2 grid w-full">
                    <label for="password">Password</label>
                    <input id="password" class="p-2 outline-none border-2 border-[#0D1321] bg-gray-50 focus:bg-white rounded" type="text" placeholder="password">
                </div>
            </div>
            <div class="p-2">
                <div class="mb-2 text-md">
                    <h2>Don't have an account? <a [routerLink]="'/auth/register'" class="hover:underline text-[#748CAB]">create account</a></h2>
                </div>
                <button class="py-2 px-6 w-full rounded bg-[#5F8FB9FF] hover:bg-[#779EC0FF] text-white font-medium cursor-pointer" type="submit">
                    Sign in
                </button>
            </div>
        </form>
    </div>
</section>
