<section class="p-16">
    <div class="flex justify-center items-center">
        <form [formGroup]="loginForm" (ngSubmit)="submit()" class="py-4 px-6 shadow-sm grid grid-rows-[auto_1fr_auto] border-2 border-stone-300 rounded gap-2">
            <div class="p-4">
                <span class="text-[#748CAB] font-light">Sign-in</span>
                <h2 class="lg:text-3xl md:text-2xl text-xl font-medium">Welcome back!</h2>
            </div>
            <div class="grid place-items-center grid-rows-[auto_auto] place-self-center min-w-[300px] max-w-[400px]">
                <div class="p-2 mb-2 grid grid-rows-[auto_1fr_auto] w-full">
                    <label for="email">Email</label>
                    <input id="email" formControlName="email" class="p-2 outline-none border-2 border-[#0D1321] bg-gray-50 focus:bg-white rounded" type="text" placeholder="email">
                    <span class="md:text-md text-sm text-[#900000FF] flex gap-2 p-1" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" viewBox="0 0 24 24" fill="#900000FF" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-alert-circle"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                        <span *ngIf="loginForm.get('email')?.errors?.['required']">
                          Email is required.
                        </span>
                        <span *ngIf="loginForm.get('email')?.errors?.['email']">
                            Password must be at least 8 characters long, include uppercase and lowercase letters, a number, and a special character.
                        </span>
                    </span>
                </div>
                <div class="p-2 mb-2 grid grid-rows-[auto_1fr_auto] w-full">
                    <label for="password">Password</label>
                    <input id="password" formControlName="password" class="p-2 outline-none border-2 border-[#0D1321] bg-gray-50 focus:bg-white rounded" type="text" placeholder="password">
                </div>
            </div>
            <div class="p-2">
                <div class="mb-2 text-md">
                    <h2>Don't have an account? <a [routerLink]="'/auth/register'" class="hover:underline text-[#748CAB]">create account</a></h2>
                </div>
                <button type="submit" class="py-2 px-6 w-full rounded bg-[#5F8FB9FF] hover:bg-[#779EC0FF] text-white font-medium cursor-pointer">
                    Sign in
                </button>
            </div>
        </form>
    </div>
</section>
